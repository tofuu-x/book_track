<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker</title>
    <link rel="stylesheet" href="fanta.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="authenticate-container">
        <div class="login-container">
            <h3>Login to your Account</h3>
            <p id="error-message" style="display:none"></p>
            <input id="emailInput" placeholder="Email">
            <input id="passwordInput" type="password" placeholder="*******">
            <button id="authBtn" onclick="authenticate()">Log in</button>
        </div>
        <hr>
        <div class="register-container">
            <h3>Don't have an Account?</h3>
            <button id="regBtn" onclick="toggleRegistration()">Sign Up</button>  
        </div>
    </div>
    <header style="display:none;">
        <h2 class="text-gradient">Track your Books!</h2>
        <h3>You have read <span id="count">0</span> books </h3>
    </header>
    <nav style="display:none;">
        <button onclick="changeTab('All')" class="selected"><h4>All</h4></button>
        <button onclick="changeTab('To be Read')"><h4>To be Read</h4></button>
        <button onclick="changeTab('Completed')"><h4>Completed</h4></button>
    </nav>
    <hr id='hr2' style="display:none;">
    <main style="display:none;">
    </main>
    
    
    

    <script>
        
        let token=localStorage.getItem('token')
        
        
        let isAuthenticating=false
        let isRegis=false
        let isLoading=false
        let timeoutId;
        let data=[];
        let selectedTab='All'

        //Elements
        const header=document.querySelector('header')
        const nav=document.querySelector('nav')
        const main=document.querySelector('main')
        const authBtn=document.getElementById('authBtn')
        const regBtn=document.getElementById('regBtn')
        const emailInput=document.getElementById('emailInput')
        const passwordInput=document.getElementById('passwordInput')
        const errorMessage=document.getElementById('error-message')
        const navElements=document.querySelectorAll('nav button')
        const readCount=document.querySelector('#count')
        

        //Functions
        function toggleRegistration(){
            isRegis=!isRegis;
            regBtn.innerText=isRegis ? "Log in" : "Sign up";
            document.querySelector(".register-container > h3").innerText=isRegis ? "Have an Account?" : "Don't have an Account?";
            document.querySelector(".login-container > h3").innerText=isRegis ? "Create your new Account" : "Login to your Account"
            authBtn.innerText=isRegis ? "Sign up" : "Log in"
        }

        function showDashboard(){
            header.style.display='block';
            nav.style.display="block";
            main.style.display="block";
            document.querySelector('.authenticate-container').style.display="none";
        }

        function updateHeader(){
            
            readCount.innerText=data.filter(book=>book.completed).length
        }

        //Authentication
        async function authenticate(){
            const username=(emailInput.value).trim();
            const password=(passwordInput.value).trim();

            if(
                isAuthenticating||
                isLoading||
                username===""||
                password===""||
                !username||
                !password){
                    displayError("Invalid Credentials. Please try again")
                    return
                }
            if(isRegis && !username.includes('@')){
                displayError('Enter a valid email!')
                return
            }

            if (isRegis && password.length<6){
                displayError("Password should be more than 6 characters");
                return;
            }
            
            isAuthenticating=true
            authBtn.innerText='Authenticating...'   
            try{
                let data;
                if(isRegis){
                    const res=await fetch('/auth/register',{
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({username,password})
                        })
                    
                    data=await res.json()
                    
                    
                    
                }else{
                    const res=await fetch('/auth/login',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({username:emailInput.value,password:passwordInput.value})
                    })
                    
                    data=await res.json()
                }
                if(data.error){
                    displayError(data.error)
                    return;
                }
                if(data.token){
                    localStorage.setItem('token',data.token)
                    token=data.token
                    getBookData()
                    showDashboard()
                }
                
               
            }catch(err){
                console.log(err)
                displayError("Authentication failed")
                
            }finally{
                isAuthenticating=false
                authBtn.innerText=isRegis ? "Sign up" : "Log in"
            }     
        }

        //Get User Book Data
        async function getBookData(){
            
            const res=await fetch('/book',{
                method:'GET',
                headers:{'Content-Type':'application/json',
                         'Authorization':token},
            })

            if (!res.ok) {
                const errorData = await res.json();
                if (res.status === 401) { 
                    alert(errorData.message); 
                    localStorage.removeItem('token'); 
                    token = null;
                    document.querySelector('.authenticate-container').style.display = "block";
                    header.style.display = "none";
                    nav.style.display = "none";
                    main.style.display = "none";
                    return;
            }
            throw new Error(errorData.message || "Failed to fetch books");
            }

            data=await res.json();     
            renderTodo()

        }

        function renderTodo(){
            updateHeader();
            booklist=""
            if (!data.length){
                booklist=`<div id="empty-list-message"><h3>No books yet!</h3>
                        <h4>Add your first book</h4></div>`
            }else{
                data.filter(val=>{
                    return selectedTab==="All" ? true : selectedTab==='Completed' ? val.completed : !val.completed
                }).forEach((book)=>{
                booklist+=`
                <div class="book-container">
                    <h5 class="book-name">${book.book_name}</h6>
                    <div class="button-grouping">
                        <button class="completed-btn" onclick="completedBook(${book.id})" ${book.completed ? 'disabled' :'' }><h6>Completed</h6></button>
                        <button class="delete-btn" onclick="deleteBook(${book.id})"><h6>Delete</h6></button>
                    </div>
                </div>`
                })
            }
            

            booklist+=
            `
            <div class="input-container">
                <input id="bookInput" placeholder="Add Book" />
                <button onClick="addBook()">
                    Add
                </button>
            </div>
            
            `

            main.innerHTML=booklist
            
        }
        


        // Displays errors and hides it after 3 seconds
        function displayError(message){
            errorMessage.innerText="❌ "+ message
                    errorMessage.style.display="block"
                    if(timeoutId){
                        clearTimeout(timeoutId)
                    }
                    timeoutId=setTimeout(()=>{
                        errorMessage.innerText=""
                        errorMessage.style.display="none"
                    },3000)
        }
        
        async function addBook(){
            const insertBookField=document.querySelector('#bookInput')
            const book=insertBookField.value
            const res= await fetch(('/book'),{
                method:'POST',
                headers:{'Content-Type':'application/json',
                    'Authorization':token
                },
                body:JSON.stringify({book_name:book})
            })
            const data=await res.json()
            await getBookData()
        }

        async function deleteBook(id){
            await fetch((`/book/${id}`),{
                method:'DELETE',
                headers:{'Authorization':token}
            })
           
            
            await getBookData();
        }

        async function completedBook(id){
            await fetch(`book/${id}`,{
                method:'PUT',
                headers:{'Authorization':token}
            })
            await getBookData()
        }

        function changeTab(tab){
            selectedTab=tab
            navElements.forEach(element=>{
                if(element.innerText.includes(selectedTab)){
                    element.classList.add('selected')
                }else{
                    element.classList.remove('selected')
                }
            })
            renderTodo()
        }


        if(token){
            async function run(){
                await getBookData();
                showDashboard();
            }
            run()
            

        }
        

    </script>
</body>
</html>
