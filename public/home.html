<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker</title>
    <link rel="stylesheet" href="fanta.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="authenticate-container">
        <div class="login-container">
            <h3>Login to your Account</h3>
            <p id="error-message" style="display:none"></p>
            <input id="emailInput" placeholder="Email">
            <input id="passwordInput" type="password" placeholder="*******">
            <button id="authBtn" onclick="authenticate()">Log in</button>
        </div>
        <hr>
        <div class="register-container">
            <h3>Don't have an Account?</h3>
            <button id="regBtn" onclick="toggleRegistration()">Sign Up</button>  
        </div>
    </div>
    <header style="display:none;">
        <h2 class="text-gradient">Track your Books!</h2>
        <h3>You have read 0 books </h3>
    </header>
    <nav style="display:none;">
        <button><h4>All</h4></button>
        <button><h4>To be Read</h4></button>
        <button><h4>Completed</h4></button>
    </nav>
    <hr style="display:none;">
    <main style="display:none;">
        <div class="book-container">
            <h5 class="book-name">A Little Life</h6>
            <div class="button-grouping">
                <button class="completed-btn"><h6>Completed</h6></button>
                <button class="delete-btn"><h6>Delete</h6></button>
            </div>
        </div>
        <div class="book-container">
            <h5 class="book-name">A Little Life</h6>
            <div class="button-grouping">
                <button class="completed-btn"><h6>Completed</h6></button>
                <button class="delete-btn"><h6>Delete</h6></button>
            </div>
        </div>
    </main>
    
    

    <script>
        let isAuthenticating=false
        let isRegis=false
        let isLoading=false
        let timeoutId;

        //Elements
        const authBtn=document.getElementById('authBtn')
        const regBtn=document.getElementById('regBtn')
        const emailInput=document.getElementById('emailInput')
        const passwordInput=document.getElementById('passwordInput')
        const errorMessage=document.getElementById('error-message')

        //Functions
        function toggleRegistration(){
            isRegis=!isRegis;
            regBtn.innerText=isRegis ? "Log in" : "Sign up";
            document.querySelector(".register-container > h3").innerText=isRegis ? "Have an Account?" : "Don't have an Account?";
            document.querySelector(".login-container > h3").innerText=isRegis ? "Create your new Account" : "Login to your Account"
            authBtn.innerText=isRegis ? "Sign up" : "Log in"
        }

        //Authentication
        async function authenticate(){
            const username=(emailInput.value).trim();
            const password=(passwordInput.value).trim();

            if(
                isAuthenticating||
                isLoading||
                username===""||
                password===""||
                !username||
                !password||
                password.length<6||
                !username.includes('@')){
                    displayError("Invalid Credentials. Please try again")
                    return
                }
            
            isAuthenticating=true
            authBtn.innerText='Authenticating...'   
            try{
                let data;
                if(isRegis){
                const res=await fetch('/auth/register',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({username,password})
                    })
                    const data=await res.json()
                    
                }else{
                const res=await fetch('/auth/login',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({username:emailInput.value,password:passwordInput.value})
                })
                const data= await res.json()
                console.log(data)   
                }
                if(!data.token){
                    throw new Error('Authentication failed')
                }
                
               
            }catch(err){
                displayError("Authentication failed")
                
            }finally{
                isAuthenticating=false
                authBtn.innerText=isRegis ? "Sign up" : "Log in"
            }
            
    

            
            
        }

        // Displays errors and hides it after 3 seconds
        function displayError(message){
            errorMessage.innerText="❌ "+ message
                    errorMessage.style.display="block"
                    if(timeoutId){
                        clearTimeout(timeoutId)
                    }
                    timeoutId=setTimeout(()=>{
                        errorMessage.innerText=""
                        errorMessage.style.display="none"
                    },3000)
        }
        

        

    </script>
</body>
</html>
